<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#0E6E7C">
<link rel="apple-touch-icon" href="./icons/icon-192.png">
<title>Abundant Laundry Shop — Laundry POS</title>
<style>
  :root{
    --ink:#0E2A32;
    --bg:#F3F8F8;
    --panel:#FFFFFF;
    --line:#DCE8E8;
    --primary:#0E6E7C;
    --primary-dark:#0A525C;
    --accent:#FFA83D;
    --accent-dark:#E08A1E;
    --good:#2FAE71;
    --warn:#E0574B;
    --muted:#5C7A7E;
    --radius:14px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg);
    color:var(--ink);
  }
  header.top{
    background:linear-gradient(135deg,var(--primary-dark),var(--primary));
    color:#fff;
    padding:22px 24px 18px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    flex-wrap:wrap;
    gap:14px;
  }
  .brand{display:flex;align-items:center;gap:14px;}
  .drum{
    width:52px;height:52px;border-radius:50%;
    background:radial-gradient(circle at 35% 30%, #ffffff33, transparent 55%),
               conic-gradient(from 0deg, var(--accent), #fff2, var(--accent));
    border:4px solid #ffffffb0;
    position:relative;
    flex-shrink:0;
    animation:spin 6s linear infinite;
  }
  .drum::after{
    content:"";
    position:absolute;inset:12px;
    border-radius:50%;
    background:var(--primary-dark);
    border:2px solid #ffffff70;
  }
  @keyframes spin{to{transform:rotate(360deg);}}
  .brand h1{margin:0;font-size:22px;letter-spacing:.5px;}
  .brand p{margin:2px 0 0;font-size:12.5px;opacity:.85;letter-spacing:2px;text-transform:uppercase;}
  nav.tabs{display:flex;gap:6px;background:#ffffff22;padding:5px;border-radius:999px;}
  nav.tabs button{
    border:0;background:transparent;color:#fff;opacity:.75;
    padding:9px 16px;border-radius:999px;font-size:14px;font-weight:600;cursor:pointer;
    transition:.15s;
  }
  nav.tabs button.active{background:#fff;color:var(--primary-dark);opacity:1;}
  main{max-width:1100px;margin:0 auto;padding:24px 18px 60px;}
  .grid{display:grid;grid-template-columns:1.1fr .9fr;gap:20px;}
  @media(max-width:820px){.grid{grid-template-columns:1fr;}}
  .card{
    background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
    padding:20px;
  }
  .card h2{margin:0 0 14px;font-size:16px;color:var(--primary-dark);}
  label{display:block;font-size:12.5px;font-weight:700;color:var(--muted);margin:12px 0 5px;text-transform:uppercase;letter-spacing:.4px;}
  label:first-child{margin-top:0;}
  input[type=text],input[type=tel],input[type=number],input[type=date],select,textarea{
    width:100%;padding:10px 12px;border:1.5px solid var(--line);border-radius:9px;
    font-size:14.5px;color:var(--ink);background:#fbfefe;
  }
  input:focus,select:focus,textarea:focus{outline:2px solid var(--primary);outline-offset:1px;}
  .svc-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:4px;}
  @media(max-width:480px){.svc-grid{grid-template-columns:1fr;}}
  .svc-option{
    border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;cursor:pointer;
    font-size:13.5px;transition:.12s;
  }
  .svc-option b{display:block;font-size:14px;}
  .svc-option small{color:var(--muted);}
  .svc-option.selected{border-color:var(--primary);background:#0E6E7C10;}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .chip-row{display:flex;gap:8px;margin-top:6px;flex-wrap:wrap;}
  .chip{
    border:1.5px solid var(--line);padding:7px 14px;border-radius:999px;font-size:13px;cursor:pointer;font-weight:600;
  }
  .chip.selected{background:var(--primary);color:#fff;border-color:var(--primary);}
  .checkbox-row{display:flex;align-items:center;gap:8px;margin-top:12px;font-size:14px;}
  .total-box{
    margin-top:16px;background:var(--primary-dark);color:#fff;border-radius:12px;
    padding:16px 18px;display:flex;justify-content:space-between;align-items:center;
  }
  .total-box .amt{font-size:26px;font-weight:800;}
  .free-badge{display:inline-block;background:var(--accent);color:#3a2400;font-size:11px;font-weight:800;padding:3px 9px;border-radius:999px;margin-top:8px;}
  button.primary{
    margin-top:16px;width:100%;background:var(--accent);color:#3a2400;border:0;
    padding:13px;border-radius:10px;font-size:15px;font-weight:800;cursor:pointer;
  }
  button.primary:hover{background:var(--accent-dark);}
  .pricelist-item{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px dashed var(--line);font-size:13.5px;}
  .pricelist-item:last-child{border-bottom:0;}
  .pricelist-item b{color:var(--primary-dark);}
  .filter-row{display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap;}
  .filter-row button{
    border:1.5px solid var(--line);background:#fff;padding:7px 14px;border-radius:999px;font-size:13px;font-weight:700;cursor:pointer;color:var(--muted);
  }
  .filter-row button.active{background:var(--ink);color:#fff;border-color:var(--ink);}
  .order-card{
    background:var(--panel);border:1px solid var(--line);border-radius:12px;
    padding:14px 16px;margin-bottom:10px;
  }
  .order-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap;}
  .order-top .num{font-size:12px;color:var(--muted);font-weight:700;}
  .order-top h3{margin:2px 0 0;font-size:16px;}
  .order-top .price{font-size:18px;font-weight:800;color:var(--primary-dark);}
  .meta-line{font-size:13px;color:var(--muted);margin-top:4px;}
  .status-pill{
    display:inline-block;padding:4px 11px;border-radius:999px;font-size:11.5px;font-weight:800;letter-spacing:.3px;text-transform:uppercase;
  }
  .status-Received{background:#E8EEF7;color:#3A5A9C;}
  .status-Washing{background:#DDF1FB;color:#0E6E7C;}
  .status-Drying{background:#FFF2DA;color:#B4720B;}
  .status-Folding{background:#F1E7FB;color:#7A3FB0;}
  .status-Ready{background:#E1F6EA;color:#1E8C57;}
  .status-Claimed{background:#EDEDED;color:#666;}
  .actions-row{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap;}
  .actions-row button{
    border:1.5px solid var(--line);background:#fff;padding:7px 12px;border-radius:8px;font-size:12.5px;font-weight:700;cursor:pointer;
  }
  .actions-row button.advance{background:var(--primary);color:#fff;border-color:var(--primary);}
  .actions-row button.danger{color:var(--warn);border-color:#f2c9c5;}
  .empty{text-align:center;color:var(--muted);padding:50px 10px;font-size:14px;}
  .stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:18px;}
  @media(max-width:600px){.stat-grid{grid-template-columns:1fr 1fr;}}
  .stat{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;}
  .stat .num{font-size:24px;font-weight:800;color:var(--primary-dark);}
  .stat .lbl{font-size:12px;color:var(--muted);text-transform:uppercase;font-weight:700;margin-top:2px;}
  .modal-bg{position:fixed;inset:0;background:#0006;display:flex;align-items:center;justify-content:center;padding:20px;z-index:50;}
  .modal{background:#fff;border-radius:14px;padding:24px;max-width:380px;width:100%;}
  .receipt-line{display:flex;justify-content:space-between;font-size:13.5px;padding:5px 0;}
  .receipt-total{border-top:2px dashed var(--line);margin-top:10px;padding-top:10px;font-size:16px;font-weight:800;display:flex;justify-content:space-between;}
  @media print{
    body *{visibility:hidden;}
    #receiptPrintArea, #receiptPrintArea *{visibility:visible;}
    #receiptPrintArea{position:absolute;top:0;left:0;width:100%;}
  }

  input[type=email],input[type=password]{
    width:100%;padding:10px 12px;border:1.5px solid var(--line);border-radius:9px;
    font-size:14.5px;color:var(--ink);background:#fbfefe;
  }
  .userbox{display:flex;align-items:center;gap:10px;}
  .userbox button{border:1.5px solid #ffffff66;background:transparent;color:#fff;padding:7px 12px;border-radius:999px;font-size:12.5px;font-weight:700;cursor:pointer;}
  .live-badge{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:800;letter-spacing:.4px;background:#ffffff22;padding:6px 11px;border-radius:999px;}
  .live-badge .dot{width:9px;height:9px;border-radius:50%;background:#ffb3a8;}
  .live-badge.on .dot{background:#5CF0A5;box-shadow:0 0 0 0 #5CF0A5aa;animation:pulse 1.8s infinite;}
  @keyframes pulse{70%{box-shadow:0 0 0 7px #5CF0A500;}100%{box-shadow:0 0 0 0 #5CF0A500;}}
  body.logged-out #tabs, body.logged-out #userBox{display:none;}
  .login-wrap{display:flex;justify-content:center;padding-top:30px;}
  .login-card{width:100%;max-width:380px;}
  .login-error{background:#FDECEA;color:#B3261E;border-radius:8px;padding:9px 12px;font-size:13px;margin-top:12px;}
  .warn-banner{background:#FFF2DA;color:#8A5A00;border:1px solid #F3D9A4;border-radius:10px;padding:10px 14px;font-size:13px;margin-bottom:14px;}
  .mon-top{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:14px;}
  .mon-top .meta-line{margin:0;}
  .pipeline{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:18px;}
  .act-item{display:flex;gap:12px;padding:11px 0;border-bottom:1px dashed var(--line);}
  .act-item:last-child{border-bottom:0;}
  .act-ic{font-size:18px;width:28px;text-align:center;flex-shrink:0;}
  .act-body{font-size:14px;}
  .act-meta{font-size:12px;color:var(--muted);margin-top:2px;}
  .small-btn{border:1.5px solid var(--line);background:#fff;padding:7px 12px;border-radius:8px;font-size:12.5px;font-weight:700;cursor:pointer;}
  #toastRoot{position:fixed;top:14px;right:14px;z-index:99;display:flex;flex-direction:column;gap:8px;max-width:340px;}
  .toast{background:var(--ink);color:#fff;padding:12px 14px;border-radius:10px;font-size:13.5px;box-shadow:0 6px 20px #0004;transition:opacity .4s;}
  .toast.hide{opacity:0;}
</style>
</head>
<body>

<header class="top">
  <div class="brand">
    <div class="drum"></div>
    <div>
      <h1>Abundant Laundry Shop</h1>
      <p>Wash · Dry · Fold · Done</p>
    </div>
  </div>
  <nav class="tabs" id="tabs">
    <button data-tab="new" class="active">New Order</button>
    <button data-tab="orders">Orders</button>
    <button data-tab="monitor">Monitor</button>
    <button data-tab="sales">Sales</button>
  </nav>
  <div class="userbox" id="userBox">
    <span class="live-badge" id="liveBadge"></span>
    <button id="signOutBtn">Sign out</button>
  </div>
</header>

<main id="app"></main>

<div id="modalRoot"></div>
<div id="toastRoot"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
/* ===================== BACKEND CONFIG =====================
   Fill these in with YOUR Supabase project's values (Project
   Settings → API in the Supabase dashboard). See README.md. */
const SUPABASE_URL = "https://zqjprpjjyrejnxrluacm.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_4qjaNSCMb877zNOeG6ZcaA_FfNHrqDO";
let sb = null; // created in init() once the library has loaded

/* ===================== PRICE LIST (from shop's rate card) ===================== */
const SERVICES = {
  wash:    { name:"Wash Only",     price:80,  unit:"per load / 8kg" },
  dry:     { name:"Dry Only",      price:85,  unit:"per load" },
  fold:    { name:"Fold Only",     price:30,  unit:"per load" },
  full:    { name:"Full Service",  price:195, unit:"per load / 8kg — Wash+Dry+Fold (detergent/fabcon not incl.)" },
  self:    { name:"Self Service",  price:165, unit:"per load / 8kg — detergent/fabcon not incl." },
  bedding: { name:"Beddings / Comforters", price:null, unit:"₱220–300 per load (set price manually)" },
};
const PACKAGES = {
  package1:{ name:"Package 1", price:255, desc:"Wash+Dry+Fold+2 Detergent+4 Fabcon+Scent Spray+Plastic" },
  package2:{ name:"Package 2", price:245, desc:"Wash+Dry+Fold+2 Detergent+3 Fabcon+Scent Spray+Plastic" },
  package3:{ name:"Package 3", price:235, desc:"Wash+Dry+Fold+2 Detergent+2 Fabcon+Scent Spray+Plastic" },
  package4:{ name:"Package 4", price:225, desc:"Wash+Dry+Fold+1 Detergent+2 Fabcon+Scent Spray+Plastic" },
};
const ALL_SERVICES = {...SERVICES, ...PACKAGES};
const STATUS_FLOW = ["Received","Washing","Drying","Folding","Ready","Claimed"];
const STATUS_LABEL = {Received:"Received",Washing:"Washing",Drying:"Drying",Folding:"Folding",Ready:"Ready for Pickup",Claimed:"Claimed"};

/* ===================== STATE ===================== */
let state = {
  tab: "new",
  orders: [],
  loaded: false,
  online: true,
  ready: false,
  session: null,
  loginEmail: "",
  loginError: "",
  loggingIn: false,
  activity: [],
  live: false,
  channel: null,
  started: false,
  lastUpdate: null,
  lastLocalAction: 0,
  form: { service:"wash", loads:1, customPrice:220, customerName:"", contact:"",
          payment:"cash", paid:false, delivery:false, adjustment:0, notes:"" },
  orderFilter: "Active",
  receiptOrder: null,
};

/* ===================== BACKEND (Supabase) ===================== */
function configMissing(){
  return SUPABASE_URL.includes('PASTE_YOUR') || SUPABASE_ANON_KEY.includes('PASTE_YOUR');
}

async function init(){
  render();
  if (typeof supabase === 'undefined'){
    document.getElementById('app').innerHTML = `<div class="empty">Could not load the database library. Check your internet connection and reload.</div>`;
    return;
  }
  if (configMissing()){
    document.getElementById('app').innerHTML = `<div class="empty"><b>Setup needed:</b> paste your Supabase URL and anon key into index.html (see README).</div>`;
    return;
  }
  sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  sb.auth.onAuthStateChange((event, session) => {
    state.session = session;
    // setTimeout avoids calling the database from inside the auth callback
    if (session) setTimeout(startSession, 0);
    else setTimeout(() => { stopSession(); render(); }, 0);
  });
  const { data } = await sb.auth.getSession();
  state.session = data.session;
  state.ready = true;
  if (state.session) await startSession(); else render();
}

async function startSession(){
  if (state.started) return;
  state.started = true;
  await Promise.all([loadData(), loadActivity()]);
  subscribeRealtime();
}
function stopSession(){
  state.started = false;
  if (state.channel){ sb.removeChannel(state.channel); state.channel = null; }
  state.orders = []; state.activity = []; state.loaded = false; state.live = false;
}

async function doLogin(password){
  state.loggingIn = true; state.loginError = ''; render();
  const { error } = await sb.auth.signInWithPassword({ email: state.loginEmail.trim(), password });
  state.loggingIn = false;
  if (error){ state.loginError = 'Wrong email or password.'; render(); }
}
async function signOut(){ await sb.auth.signOut(); }

async function loadData(quiet){
  const { data, error } = await sb.from('orders').select('*').order('id', { ascending:false });
  if (error){ console.error(error); state.online = false; }
  else {
    state.online = true;
    state.orders = data.map(o => ({
      ...o,
      total: Number(o.total),
      adjustment: Number(o.adjustment || 0),
      custom_price: o.custom_price == null ? null : Number(o.custom_price),
    }));
  }
  state.loaded = true;
  state.lastUpdate = new Date();
  // Don't redraw the New Order form while someone is typing in it
  if (quiet && state.tab === 'new') return;
  render();
}
async function loadActivity(){
  const { data, error } = await sb.from('activity_log').select('*').order('id', { ascending:false }).limit(60);
  if (!error) state.activity = data;
  if (state.tab === 'monitor') render();
}
async function catchUp(){
  if (!state.session || !state.started) return;
  await Promise.all([loadData(true), loadActivity()]);
}

// Live sync: any device inserts/updates/deletes an order -> every signed-in
// device updates instantly, and new activity pops up as an alert.
function subscribeRealtime(){
  if (state.channel) return;
  state.channel = sb.channel('shop-live')
    .on('postgres_changes', { event:'*', schema:'public', table:'orders' }, () => { loadData(true); })
    .on('postgres_changes', { event:'INSERT', schema:'public', table:'activity_log' }, (payload) => { onActivity(payload.new); })
    .subscribe((status) => {
      state.live = (status === 'SUBSCRIBED');
      if (state.live) catchUp();
      updateLiveBadge();
      if (state.tab === 'monitor') render();
    });
}

function onActivity(a){
  state.activity.unshift(a);
  state.activity = state.activity.slice(0, 60);
  state.lastUpdate = new Date();
  const mine = (Date.now() - state.lastLocalAction) < 4000;
  if (!mine){
    showToast(a.detail);
    if (a.action === 'created') beep();
    desktopNotify(a);
  }
  if (state.tab === 'monitor') render();
}

function updateLiveBadge(){
  const el = document.getElementById('liveBadge');
  if (!el) return;
  el.className = 'live-badge' + (state.live ? ' on' : '');
  el.innerHTML = '<span class="dot"></span>' + (state.live ? 'Live' : 'Reconnecting…');
}
function showToast(text){
  const root = document.getElementById('toastRoot');
  if (!root) return;
  const t = document.createElement('div');
  t.className = 'toast'; t.textContent = text;
  root.appendChild(t);
  setTimeout(() => t.classList.add('hide'), 4500);
  setTimeout(() => t.remove(), 5000);
}
function beep(){
  try{
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.connect(g); g.connect(ctx.destination);
    o.frequency.value = 880; g.gain.value = 0.08;
    o.start(); o.stop(ctx.currentTime + 0.18);
  }catch(e){}
}
function desktopNotify(a){
  try{
    if ('Notification' in window && Notification.permission === 'granted' && document.hidden){
      new Notification('Abundant Laundry Shop', { body: a.detail });
    }
  }catch(e){}
}
function relTime(iso){
  const s = Math.max(0, Math.floor((Date.now() - new Date(iso).getTime()) / 1000));
  if (s < 45) return 'just now';
  if (s < 3600) return Math.round(s/60) + ' min ago';
  if (s < 86400) return Math.round(s/3600) + ' h ago';
  return new Date(iso).toLocaleString('en-PH', { month:'short', day:'numeric', hour:'2-digit', minute:'2-digit' });
}

/* ===================== RENDER: LOGIN ===================== */
function renderLogin(){
  return `
  <div class="login-wrap"><div class="card login-card">
    <h2>Sign in</h2>
    <label>Email</label>
    <input type="email" id="loginEmail" value="${esc(state.loginEmail)}" autocomplete="username">
    <label>Password</label>
    <input type="password" id="loginPassword" autocomplete="current-password">
    ${state.loginError ? `<div class="login-error">${esc(state.loginError)}</div>` : ''}
    <button class="primary" id="loginBtn" ${state.loggingIn ? 'disabled' : ''}>${state.loggingIn ? 'Signing in…' : 'Sign in'}</button>
    <div class="meta-line" style="margin-top:12px;">Accounts are created by the shop owner.</div>
  </div></div>`;
}
function attachLoginEvents(){
  const em = document.getElementById('loginEmail'), pw = document.getElementById('loginPassword');
  if (!em || !pw) return;
  em.oninput = e => { state.loginEmail = e.target.value; };
  const go = () => doLogin(pw.value);
  document.getElementById('loginBtn').onclick = go;
  pw.onkeydown = e => { if (e.key === 'Enter') go(); };
}

/* ===================== RENDER: MONITOR TAB ===================== */
function renderMonitor(){
  const startToday = new Date(); startToday.setHours(0,0,0,0);
  const today = state.orders.filter(o => new Date(o.created_at) >= startToday);
  const salesToday = today.reduce((s,o) => s + o.total, 0);
  const active = state.orders.filter(o => o.status !== 'Claimed');
  const unpaid = state.orders.filter(o => !o.paid).reduce((s,o) => s + o.total, 0);
  const pipeline = STATUS_FLOW.filter(s => s !== 'Claimed').map(s =>
    `<span class="status-pill status-${s}">${STATUS_LABEL[s]}: ${active.filter(o => o.status === s).length}</span>`).join('');
  const icon = { created:'🆕', status:'🔄', paid:'💰', deleted:'🗑️' };
  const feed = state.activity.map(a => `
    <div class="act-item">
      <div class="act-ic">${icon[a.action] || '•'}</div>
      <div class="act-body">
        <div>${esc(a.detail)}</div>
        <div class="act-meta" title="${esc(new Date(a.created_at).toLocaleString('en-PH'))}">${relTime(a.created_at)}${a.actor ? ' · ' + esc(String(a.actor).split('@')[0]) : ''}</div>
      </div>
    </div>`).join('');

  let alertsBtn = '';
  if (!('Notification' in window)) alertsBtn = `<span class="meta-line">Pop-up alerts aren't supported on this browser.</span>`;
  else if (Notification.permission === 'default') alertsBtn = `<button class="small-btn" data-enablealerts>Enable alerts on this device</button>`;
  else if (Notification.permission === 'granted') alertsBtn = `<span class="meta-line">Alerts on ✓ (while the app is open or in the background)</span>`;
  else alertsBtn = `<span class="meta-line">Alerts are blocked in this browser's settings.</span>`;

  return `
    <div class="mon-top">
      <div class="meta-line">${state.live ? '🟢 Live — updates appear instantly' : '🟠 Reconnecting… showing last known data'}${state.lastUpdate ? ' · last sync ' + state.lastUpdate.toLocaleTimeString('en-PH',{hour:'2-digit',minute:'2-digit'}) : ''}</div>
      <div>${alertsBtn}</div>
    </div>
    <div class="stat-grid">
      <div class="stat"><div class="num">${today.length}</div><div class="lbl">Orders Today</div></div>
      <div class="stat"><div class="num">${peso(salesToday)}</div><div class="lbl">Sales Today</div></div>
      <div class="stat"><div class="num">${active.length}</div><div class="lbl">Active Orders</div></div>
      <div class="stat"><div class="num">${active.filter(o => o.status === 'Ready').length}</div><div class="lbl">Ready for Pickup</div></div>
      <div class="stat"><div class="num">${peso(unpaid)}</div><div class="lbl">Unpaid Balance</div></div>
      <div class="stat"><div class="num">${state.orders.length}</div><div class="lbl">All-Time Orders</div></div>
    </div>
    <div class="pipeline">${pipeline}</div>
    <div class="card">
      <h2>Live Activity</h2>
      ${feed || `<div class="empty">No activity yet — new orders and updates will show up here.</div>`}
    </div>`;
}

/* ===================== HELPERS ===================== */
function esc(s){
  return String(s||"").replace(/[&<>"']/g, m => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
}
function peso(n){ return "₱" + Number(n||0).toLocaleString('en-PH', {minimumFractionDigits:2, maximumFractionDigits:2}); }
function isPackage(key){ return !!PACKAGES[key]; }

function calcTotal(f){
  let base = 0;
  if (f.service === "bedding") base = Number(f.customPrice)||0;
  else base = ALL_SERVICES[f.service].price;
  const loads = f.service === "bedding" ? 1 : (Number(f.loads)||1);
  return base * loads + (Number(f.adjustment)||0);
}
function freeDelivery(f){
  return f.service !== "bedding" && (Number(f.loads)||1) >= 2;
}

/* ===================== RENDER: NEW ORDER TAB ===================== */
function renderNewOrder(){
  const f = state.form;
  const svcOptions = Object.entries(SERVICES).map(([key,s]) => `
    <div class="svc-option ${f.service===key?'selected':''}" data-svc="${key}">
      <b>${s.name}${s.price?` — ${peso(s.price)}`:''}</b>
      <small>${s.unit}</small>
    </div>`).join('');
  const pkgOptions = Object.entries(PACKAGES).map(([key,p]) => `
    <div class="svc-option ${f.service===key?'selected':''}" data-svc="${key}">
      <b>${p.name} — ${peso(p.price)}</b>
      <small>${p.desc}</small>
    </div>`).join('');

  const total = calcTotal(f);
  const fd = freeDelivery(f);

  return `
  <div class="grid">
    <div class="card">
      <h2>Customer & Order</h2>
      <label>Customer Name</label>
      <input type="text" id="customerName" value="${esc(f.customerName)}" placeholder="Juan Dela Cruz">
      <label>Contact Number</label>
      <input type="tel" id="contact" value="${esc(f.contact)}" placeholder="09XX XXX XXXX">

      <label>Standard Services</label>
      <div class="svc-grid">${svcOptions}</div>

      <label>All-In Packages</label>
      <div class="svc-grid">${pkgOptions}</div>

      ${f.service==="bedding" ? `
        <label>Set Price (₱220–300)</label>
        <input type="number" id="customPrice" min="220" max="300" value="${f.customPrice}">
      ` : `
        <label>Number of Loads</label>
        <div class="chip-row" id="loadsRow">
          ${[1,2,3,4].map(n=>`<div class="chip ${f.loads==n?'selected':''}" data-loads="${n}">${n}</div>`).join('')}
        </div>
      `}

      <label>Adjustment (₱, use negative for discount)</label>
      <input type="number" id="adjustment" value="${f.adjustment}">

      <label>Notes</label>
      <textarea id="notes" rows="2" placeholder="e.g. heavy load, light wash, VIP customer...">${esc(f.notes)}</textarea>

      <div class="checkbox-row">
        <input type="checkbox" id="delivery" ${f.delivery?'checked':''}>
        <label style="margin:0;text-transform:none;font-weight:600;">Pickup & Delivery requested</label>
      </div>
      ${f.delivery && fd ? `<div class="free-badge">FREE — 2+ loads qualifies</div>` : ''}
      ${f.delivery && !fd ? `<div class="meta-line">Delivery fee applies below 2 loads — set via Adjustment field.</div>` : ''}

      <label>Payment Method</label>
      <div class="chip-row">
        <div class="chip ${f.payment==='cash'?'selected':''}" data-pay="cash">Cash</div>
        <div class="chip ${f.payment==='gcash'?'selected':''}" data-pay="gcash">GCash</div>
      </div>
      <div class="checkbox-row">
        <input type="checkbox" id="paid" ${f.paid?'checked':''}>
        <label style="margin:0;text-transform:none;font-weight:600;">Paid already</label>
      </div>

      <div class="total-box">
        <span>Total</span>
        <span class="amt">${peso(total)}</span>
      </div>
      <button class="primary" id="createOrderBtn">Create Order</button>
    </div>

    <div class="card">
      <h2>Rate Card</h2>
      ${Object.values(SERVICES).map(s=>`
        <div class="pricelist-item"><span>${s.name}<br><small style="color:var(--muted)">${s.unit}</small></span><b>${s.price?peso(s.price):'₱220–300'}</b></div>
      `).join('')}
      <h2 style="margin-top:18px;">Packages (All-In)</h2>
      ${Object.values(PACKAGES).map(p=>`
        <div class="pricelist-item"><span>${p.name}<br><small style="color:var(--muted)">${p.desc}</small></span><b>${peso(p.price)}</b></div>
      `).join('')}
      <div class="meta-line" style="margin-top:14px;">1 load ≈ 4–13kg · Free pickup & delivery for 2 loads and up · Cash & GCash accepted</div>
    </div>
  </div>`;
}

/* ===================== RENDER: ORDERS TAB ===================== */
function renderOrders(){
  const filters = ["Active","Received","Washing","Drying","Folding","Ready","Claimed","All"];
  let list = state.orders.slice().sort((a,b)=>b.id-a.id);
  if (state.orderFilter === "Active") list = list.filter(o=>o.status!=="Claimed");
  else if (state.orderFilter !== "All") list = list.filter(o=>o.status===state.orderFilter);

  const cards = list.map(o => {
    const svc = ALL_SERVICES[o.service];
    const idx = STATUS_FLOW.indexOf(o.status);
    const next = STATUS_FLOW[idx+1];
    return `
    <div class="order-card">
      <div class="order-top">
        <div>
          <div class="num">#${String(o.id).padStart(4,'0')} · ${new Date(o.created_at).toLocaleString('en-PH',{month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'})}</div>
          <h3>${esc(o.customer_name)||'Walk-in Customer'}</h3>
        </div>
        <div class="price">${peso(o.total)}</div>
      </div>
      <div class="meta-line">${svc.name} ${o.service!=="bedding" && !isPackage(o.service) ? `× ${o.loads} load(s)`:''} · ${o.contact?esc(o.contact)+' · ':''}${o.payment.toUpperCase()} ${o.paid?'(Paid)':'(Unpaid)'}${o.delivery?' · Delivery':''}</div>
      ${o.notes ? `<div class="meta-line">📝 ${esc(o.notes)}</div>`:''}
      <div style="margin-top:8px;">
        <span class="status-pill status-${o.status}">${STATUS_LABEL[o.status]}</span>
      </div>
      <div class="actions-row">
        ${next ? `<button class="advance" data-advance="${o.id}">Mark as ${STATUS_LABEL[next]}</button>` : ''}
        <button data-receipt="${o.id}">Receipt</button>
        <button data-togglepaid="${o.id}">${o.paid ? 'Mark Unpaid' : 'Mark Paid'}</button>
        <button class="danger" data-delete="${o.id}">Delete</button>
      </div>
    </div>`;
  }).join('');

  return `
    <div class="filter-row">
      ${filters.map(f=>`<button data-filter="${f}" class="${state.orderFilter===f?'active':''}">${f}</button>`).join('')}
    </div>
    ${cards || `<div class="empty">No orders here yet.</div>`}
  `;
}

/* ===================== RENDER: SALES TAB ===================== */
function renderSales(){
  const orders = state.orders;
  const total = orders.reduce((s,o)=>s+o.total,0);
  const paidTotal = orders.filter(o=>o.paid).reduce((s,o)=>s+o.total,0);
  const cash = orders.filter(o=>o.payment==='cash').reduce((s,o)=>s+o.total,0);
  const gcash = orders.filter(o=>o.payment==='gcash').reduce((s,o)=>s+o.total,0);
  const claimed = orders.filter(o=>o.status==='Claimed').length;

  const bySvc = {};
  orders.forEach(o=>{ bySvc[o.service] = (bySvc[o.service]||0) + o.total; });
  const bySvcRows = Object.entries(bySvc).sort((a,b)=>b[1]-a[1])
    .map(([k,v])=>`<div class="pricelist-item"><span>${ALL_SERVICES[k].name}</span><b>${peso(v)}</b></div>`).join('');

  return `
    <div class="stat-grid">
      <div class="stat"><div class="num">${orders.length}</div><div class="lbl">Total Orders</div></div>
      <div class="stat"><div class="num">${peso(total)}</div><div class="lbl">Total Sales</div></div>
      <div class="stat"><div class="num">${peso(total-paidTotal)}</div><div class="lbl">Unpaid Balance</div></div>
      <div class="stat"><div class="num">${peso(cash)}</div><div class="lbl">Cash</div></div>
      <div class="stat"><div class="num">${peso(gcash)}</div><div class="lbl">GCash</div></div>
      <div class="stat"><div class="num">${claimed}</div><div class="lbl">Claimed</div></div>
    </div>
    <div class="card">
      <h2>Sales by Service</h2>
      ${bySvcRows || `<div class="empty">No sales recorded yet.</div>`}
    </div>
  `;
}

/* ===================== RECEIPT MODAL ===================== */
function renderReceiptModal(){
  const o = state.orders.find(x=>x.id===state.receiptOrder);
  if(!o) return "";
  const svc = ALL_SERVICES[o.service];
  return `
  <div class="modal-bg" id="modalBg">
    <div class="modal" id="receiptPrintArea">
      <div style="text-align:center;margin-bottom:10px;">
        <div style="font-weight:800;font-size:18px;color:var(--primary-dark)">Abundant Laundry Shop</div>
        <div style="font-size:12px;color:var(--muted)">Wash · Dry · Fold · Done</div>
        <div style="font-size:11px;color:var(--muted);margin-top:4px;">Order #${String(o.id).padStart(4,'0')} — ${new Date(o.created_at).toLocaleString('en-PH')}</div>
      </div>
      <div class="receipt-line"><span>Customer</span><span>${esc(o.customer_name)||'Walk-in'}</span></div>
      <div class="receipt-line"><span>Service</span><span>${svc.name}</span></div>
      ${o.service!=="bedding" && !isPackage(o.service) ? `<div class="receipt-line"><span>Loads</span><span>${o.loads}</span></div>`:''}
      <div class="receipt-line"><span>Payment</span><span>${o.payment.toUpperCase()} (${o.paid?'Paid':'Unpaid'})</span></div>
      ${o.delivery?`<div class="receipt-line"><span>Delivery</span><span>${freeDelivery(o)?'FREE':'Fee applied'}</span></div>`:''}
      <div class="receipt-total"><span>Total</span><span>${peso(o.total)}</span></div>
      <div style="text-align:center;margin-top:16px;font-size:11px;color:var(--muted);">Thank you for your laundry! 🧺</div>
      <div class="actions-row" style="margin-top:16px;">
        <button data-print style="flex:1;background:var(--primary);color:#fff;border-color:var(--primary);">Print</button>
        <button data-closemodal style="flex:1;">Close</button>
      </div>
    </div>
  </div>`;
}

/* ===================== MAIN RENDER ===================== */
function render(){
  document.body.classList.toggle('logged-out', !state.session);
  const app = document.getElementById('app');
  if(!state.ready){ app.innerHTML = `<div class="empty">Loading...</div>`; return; }
  if(!state.session){
    app.innerHTML = renderLogin();
    document.getElementById('modalRoot').innerHTML = "";
    attachLoginEvents();
    return;
  }
  document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('active', b.dataset.tab===state.tab));
  updateLiveBadge();
  if(!state.loaded){ app.innerHTML = `<div class="empty">Loading...</div>`; return; }
  const banner = state.online ? '' : `<div class="warn-banner">Can't reach the database right now — showing the last data received. Changes won't save until the connection is back.</div>`;
  if(state.tab==='new') app.innerHTML = banner + renderNewOrder();
  else if(state.tab==='orders') app.innerHTML = banner + renderOrders();
  else if(state.tab==='monitor') app.innerHTML = banner + renderMonitor();
  else app.innerHTML = banner + renderSales();
  document.getElementById('modalRoot').innerHTML = state.receiptOrder ? renderReceiptModal() : "";
  attachEvents();
}

/* ===================== EVENTS ===================== */
function attachEvents(){
  document.querySelectorAll('#tabs button').forEach(b=>{
    b.onclick = ()=>{ state.tab = b.dataset.tab; render(); };
  });
  document.getElementById('signOutBtn').onclick = signOut;

  if(state.tab==='monitor'){
    const ab = document.querySelector('[data-enablealerts]');
    if(ab) ab.onclick = async ()=>{ try{ await Notification.requestPermission(); }catch(e){} render(); };
  }

  if(state.tab==='new'){
    const f = state.form;
    document.getElementById('customerName').oninput = e=>{ f.customerName = e.target.value; };
    document.getElementById('contact').oninput = e=>{ f.contact = e.target.value; };
    document.querySelectorAll('[data-svc]').forEach(el=>{
      el.onclick = ()=>{ f.service = el.dataset.svc; if(f.service==='bedding') f.loads=1; render(); };
    });
    document.querySelectorAll('[data-loads]').forEach(el=>{
      el.onclick = ()=>{ f.loads = parseInt(el.dataset.loads,10); render(); };
    });
    const cp = document.getElementById('customPrice');
    if(cp) cp.oninput = e=>{ f.customPrice = e.target.value; render(); };
    document.getElementById('adjustment').oninput = e=>{ f.adjustment = e.target.value; render(); };
    document.getElementById('notes').oninput = e=>{ f.notes = e.target.value; };
    document.getElementById('delivery').onchange = e=>{ f.delivery = e.target.checked; render(); };
    document.querySelectorAll('[data-pay]').forEach(el=>{
      el.onclick = ()=>{ f.payment = el.dataset.pay; render(); };
    });
    document.getElementById('paid').onchange = e=>{ f.paid = e.target.checked; };
    document.getElementById('createOrderBtn').onclick = createOrder;
  }

  if(state.tab==='orders'){
    document.querySelectorAll('[data-filter]').forEach(el=>{
      el.onclick = ()=>{ state.orderFilter = el.dataset.filter; render(); };
    });
    document.querySelectorAll('[data-advance]').forEach(el=>{
      el.onclick = ()=>advanceStatus(Number(el.dataset.advance));
    });
    document.querySelectorAll('[data-receipt]').forEach(el=>{
      el.onclick = ()=>{ state.receiptOrder = Number(el.dataset.receipt); render(); };
    });
    document.querySelectorAll('[data-togglepaid]').forEach(el=>{
      el.onclick = ()=>togglePaid(Number(el.dataset.togglepaid));
    });
    document.querySelectorAll('[data-delete]').forEach(el=>{
      el.onclick = ()=>deleteOrder(Number(el.dataset.delete));
    });
  }

  const modalBg = document.getElementById('modalBg');
  if(modalBg){
    modalBg.onclick = (e)=>{ if(e.target.id==='modalBg'){ state.receiptOrder=null; render(); } };
    const closeBtn = document.querySelector('[data-closemodal]');
    if(closeBtn) closeBtn.onclick = ()=>{ state.receiptOrder=null; render(); };
    const printBtn = document.querySelector('[data-print]');
    if(printBtn) printBtn.onclick = ()=>window.print();
  }
}

async function createOrder(){
  const f = state.form;
  if(f.service==='bedding' && (f.customPrice<220 || f.customPrice>300)){
    alert('Beddings/Comforters price must be between ₱220 and ₱300.');
    return;
  }
  const row = {
    customer_name: f.customerName.trim(),
    contact: f.contact.trim(),
    service: f.service,
    loads: f.service==='bedding' ? 1 : Number(f.loads),
    custom_price: f.service==='bedding' ? Number(f.customPrice) : null,
    payment: f.payment,
    paid: f.paid,
    delivery: f.delivery,
    adjustment: Number(f.adjustment)||0,
    notes: f.notes.trim(),
    total: calcTotal(f),
    status: "Received",
  };
  state.lastLocalAction = Date.now();
  const { error } = await sb.from('orders').insert([row]);
  if (error){ console.error(error); alert('Could not save to the database — check your internet connection and Supabase setup.'); return; }
  state.form = { service:"wash", loads:1, customPrice:220, customerName:"", contact:"",
                 payment:"cash", paid:false, delivery:false, adjustment:0, notes:"" };
  state.tab = "orders";
  state.orderFilter = "Active";
  await loadData();
}

async function advanceStatus(id){
  const o = state.orders.find(x=>x.id===id);
  if(!o) return;
  const idx = STATUS_FLOW.indexOf(o.status);
  if(idx < STATUS_FLOW.length-1){
    state.lastLocalAction = Date.now();
    const { error } = await sb.from('orders').update({ status: STATUS_FLOW[idx+1] }).eq('id', id);
    if (error){ alert('Could not update — check your connection.'); return; }
    await loadData();
  }
}
async function togglePaid(id){
  const o = state.orders.find(x=>x.id===id);
  if(!o) return;
  state.lastLocalAction = Date.now();
  const { error } = await sb.from('orders').update({ paid: !o.paid }).eq('id', id);
  if (error){ alert('Could not update — check your connection.'); return; }
  await loadData();
}
async function deleteOrder(id){
  if(!confirm('Delete this order? This cannot be undone.')) return;
  state.lastLocalAction = Date.now();
  const { error } = await sb.from('orders').delete().eq('id', id);
  if (error){ alert('Could not delete — check your connection.'); return; }
  await loadData();
}

init();

// Keep things fresh when the app comes back to the foreground, and keep
// "x min ago" labels ticking. Falls back to polling if realtime drops.
document.addEventListener('visibilitychange', () => { if(!document.hidden) catchUp(); });
setInterval(() => {
  if(!state.session) return;
  if(!state.live) catchUp();
  else if(state.tab==='monitor') render();
}, 30000);

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./service-worker.js').catch(e=>console.log('SW failed', e));
  });
}
</script>
</body>
</html>
